name: Release Application

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build Application and Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production configuration
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "Missing EXPO_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || { echo "Missing EXPO_PUBLIC_SUPABASE_ANON_KEY"; exit 1; }
          test -n "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" || { echo "Missing EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID"; exit 1; }

      - name: Run TypeScript Check
        run: pnpm run typecheck

      - name: Build Production Web Export
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: pnpm run build:web

      - name: Package Web Production Distribution
        run: |
          cd dist
          zip -X -r ../marush-app-web-${{ github.ref_name }}.zip .
          cd ..

      - name: Generate SHA-256 checksum
        run: sha256sum marush-app-web-${{ github.ref_name }}.zip > marush-app-web-${{ github.ref_name }}.zip.sha256

      - name: Generate Changelog & Release Notes
        id: release_notes
        run: |
          echo "## Marush Web Release ${{ github.ref_name }}" > release_notes.md
          echo "" >> release_notes.md
          echo "**Marush (Pvt.) Ltd. — Poultry Vaccination & Flock Monitoring Service**" >> release_notes.md
          echo "- Exclusive Ceva Animal Health Sole Distributor Pakistan" >> release_notes.md
          echo "- Built with Expo, React Native Web, Supabase, and TypeScript" >> release_notes.md
          echo "" >> release_notes.md
          echo "#### Key Features Included in this Release:" >> release_notes.md
          echo "- 🔐 RBAC Authentication (Admin, Program Controller, Program Auditor, Employee)" >> release_notes.md
          echo "- 🛡️ Account approval pipeline for Admin review" >> release_notes.md
          echo "- 📊 Admin Dashboard: Overview, Active Programs, Completed Programs, Employee CRUD" >> release_notes.md
          echo "- 👥 Program Controller: Dynamic team creation filtering active vs available employees" >> release_notes.md
          echo "- 🔍 Program Auditor: Dedicated inspection queue, sign-off and remarks" >> release_notes.md
          echo "- 📱 Employee Dashboard: Attended programs & assigned role history" >> release_notes.md
          echo "" >> release_notes.md
          echo "#### Assets:" >> release_notes.md
          echo "- \`marush-app-web-${{ github.ref_name }}.zip\` (production web export)" >> release_notes.md
          echo "- \`marush-app-web-${{ github.ref_name }}.zip.sha256\` (SHA-256 checksum)" >> release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" \
          "marush-app-web-${GITHUB_REF_NAME}.zip" \
          "marush-app-web-${GITHUB_REF_NAME}.zip.sha256" \
          --title "Marush Web ${GITHUB_REF_NAME}" \
          --notes-file release_notes.md
